name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Strict check
        run: moon check --target js --deny-warn

      - name: Test
        run: moon test --target js

      - name: Enforce release policy gate
        shell: bash
        run: |
          gate_output="$(moon run cmd/rulescope --target js -- gate clean-age strict)"
          echo "$gate_output"
          echo "$gate_output" | grep -q 'Quality gate \[strict\]: PASS'

      - name: Generate machine-readable analysis artifact
        run: moon run cmd/rulescope --target js -- json checkout > rulescope-report.json

      - name: Build release browser core
        run: moon build --target js --release

      - name: Verify generated interface and formatting
        shell: bash
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Verify generated browser core is current
        shell: bash
        run: |
          cmp _build/js/release/build/web/core/core.js dist/rulescope-core.js

      - name: Verify authored source size
        shell: pwsh
        run: ./scripts/count-source.ps1

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: rulescope-analysis
          path: rulescope-report.json

